<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doubles Mystery Box</title>
    <style>
        :root {
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            color: #203047;
            background: #eef4fb
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            padding: 20px
        }

        .app {
            max-width: 790px;
            margin: auto
        }

        .panel {
            background: white;
            border-radius: 22px;
            padding: 22px;
            margin: 14px 0;
            box-shadow: 0 5px 24px #1b365414
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: clamp(28px, 5vw, 42px)
        }

        .subtitle {
            text-align: center;
            color: #66778b;
            margin: 5px 0 22px
        }

        .settings,
        .scores,
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center
        }

        .settings label {
            font-weight: 700
        }

        select,
        button,
        input {
            font: inherit;
            border-radius: 12px;
            padding: 11px 14px
        }

        select,
        input {
            border: 2px solid #d5e0ed;
            background: white
        }

        button {
            border: 0;
            background: #0071ce;
            color: white;
            font-weight: 750;
            cursor: pointer
        }

        button:hover:not(:disabled) {
            filter: brightness(.94)
        }

        button:disabled {
            cursor: default;
            opacity: .58
        }

        .secondary {
            background: #e7edf5;
            color: #284261
        }

        .scores {
            margin-top: 20px
        }

        .score {
            flex: 1;
            min-width: 140px;
            text-align: center;
            border-radius: 15px;
            padding: 14px;
            font-weight: 700
        }

        .score strong {
            display: block;
            font-size: 38px
        }

        .blue {
            background: #e4f2ff;
            color: #0071ce
        }

        .green {
            background: #dcfaef;
            color: #008d67
        }

        .solo {
            background: #fff3d8;
            color: #926400
        }

        .turn {
            text-align: center;
            font-weight: 800;
            font-size: 21px
        }

        .progress {
            text-align: center;
            color: #66778b;
            margin: 8px 0 18px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px
        }

        .box {
            background: #fff2d5;
            color: #7c4a00;
            border: 2px solid #f8d58c;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px
        }

        .box .emoji {
            font-size: 33px
        }

        .box.opened {
            background: #edf1f5;
            color: #66778b;
            border-color: #e1e7ee
        }

        .question {
            text-align: center
        }

        .equation {
            font-size: clamp(38px, 8vw, 64px);
            font-weight: 850;
            margin: 20px 0
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin: 20px auto;
            max-width: 520px
        }

        .choice {
            font-size: clamp(22px, 5vw, 32px);
            padding: 20px 8px;
            background: #e9f3ff;
            color: #0065b5;
            border: 2px solid #b7d9fa
        }

        .choice:hover:not(:disabled) {
            background: #cce8ff
        }

        .choice:disabled {
            opacity: 1
        }

        .choice.correct {
            background: #dcfaef;
            border-color: #0dc28a;
            color: #087f5b
        }

        .choice.wrong {
            background: #ffe3e3;
            border-color: #ef7777;
            color: #a52727
        }

        .hint {
            color: #607389
        }

        .feedback {
            font-size: 23px;
            font-weight: 800;
            margin: 15px
        }

        .hidden {
            display: none !important
        }

        .winner {
            text-align: center;
            font-size: 26px;
            font-weight: 850
        }

        .small {
            font-size: 13px;
            color: #6c7b8a;
            text-align: center
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid #f8a900;
            outline-offset: 3px
        }

        @media(max-width:440px) {
            body {
                padding: 10px
            }

            .panel {
                padding: 15px
            }

            .grid {
                gap: 8px
            }

            .box {
                min-height: 85px
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <section class="panel">
            <h1>🎁 Mystery Doubles!</h1>
            <p class="subtitle">A new mystery every round • Grade 2 Math</p>
            <div class="settings"><label for="mode">Mode</label><select id="mode">
                    <option value="teams">🔵🟢 Two Teams</option>
                    <option value="solo">⭐ Solo Player</option>
                </select><label for="difficulty">Difficulty</label><select id="difficulty">
                    <option value="easy">Easy (0–10)</option>
                    <option value="medium" selected>Medium (0–12)</option>
                    <option value="challenge">Challenge (0–20)</option>
                </select></div>
            <div class="scores" id="scores"></div>
        </section>
        <section class="panel">
            <div class="turn" id="turn"></div>
            <div class="progress" id="progress"></div>
            <div id="boxes" class="grid"></div>
            <div id="question" class="question hidden">
                <div class="hint" id="boxTitle"></div>
                <div class="equation" id="equation"></div>
                <p class="hint" id="whisper"></p>
                <p class="hint">Choose the correct answer:</p>
                <div id="choices" class="choices" role="group" aria-label="Answer choices"></div>
            </div>
            <div id="result" class="question hidden">
                <div class="equation" id="solution"></div>
                <div class="feedback" id="feedback" aria-live="polite"></div><button id="next">Next Turn →</button>
            </div>
            <div id="finished" class="question hidden">
                <div class="winner" id="winner"></div>
                <p>Great job practicing doubles facts!</p><button id="again">🎲 Play a New Round</button>
            </div>
        </section>
        <div class="actions"><button class="secondary" id="restart">↻ Restart with New Questions</button></div>
        <p class="small">All points are hidden until an answer is checked. Each round shuffles questions, answer
            choices, and points.</p>
    </main>
    <script>
        (() => { 'use strict'; const $ = id => document.getElementById(id); const values = { easy: 10, medium: 12, challenge: 20 }; let game, round = 0; function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] } return a } function makeChoices(n, limit) { const correct = n * 2; const candidates = shuffle(Array.from({ length: limit + 1 }, (_, i) => i * 2).filter(v => v !== correct)); return shuffle([correct, ...candidates.slice(0, 2)]) } function newGame() { round++; const mode = $('mode').value, limit = values[$('difficulty').value]; let nums = shuffle(Array.from({ length: limit + 1 }, (_, i) => i)); while (nums.length < 12) nums.push(...shuffle(Array.from({ length: limit + 1 }, (_, i) => i)).slice(0, 12 - nums.length)); game = { mode, facts: nums.slice(0, 12).map(n => ({ n, points: [10, 20, 30, 40, 50][Math.floor(Math.random() * 5)] })), opened: [], turn: 0, score: [0, 0], selected: null, stage: 'boxes' }; render() } function render() { const solo = game.mode === 'solo'; $('scores').innerHTML = solo ? `<div class="score solo">⭐ Your Points<strong>${game.score[0]}</strong></div>` : `<div class="score blue">🔵 Team Blue<strong>${game.score[0]}</strong></div><div class="score green">🟢 Team Green<strong>${game.score[1]}</strong></div>`; $('turn').textContent = game.stage === 'finished' ? '🏆 Round Complete!' : solo ? '⭐ Your Turn!' : game.turn === 0 ? '🔵 Team Blue — Your Turn!' : '🟢 Team Green — Your Turn!'; $('progress').textContent = `${game.opened.length} of 12 boxes opened · Round ${round}`; for (const id of ['boxes', 'question', 'result', 'finished']) $(id).classList.toggle('hidden', game.stage !== id); if (game.stage === 'boxes') { $('boxes').innerHTML = ''; game.facts.forEach((f, i) => { const b = document.createElement('button'); b.className = 'box' + (game.opened.includes(i) ? ' opened' : ''); b.disabled = game.opened.includes(i); b.innerHTML = `<span class="emoji">${b.disabled ? '✅' : '🎁'}</span><span>${b.disabled ? 'Opened' : 'Box ' + (i + 1)}</span>`; b.addEventListener('click', () => { game.selected = i; game.stage = 'question'; game.choices = makeChoices(game.facts[i].n, values[$('difficulty').value]); render() }); $('boxes').append(b) }) } if (game.stage === 'question') { let f = game.facts[game.selected]; $('boxTitle').textContent = '🎁 MYSTERY BOX ' + (game.selected + 1); $('equation').textContent = `${f.n} + ${f.n} = ?`; $('whisper').textContent = solo ? 'Say the doubles fact aloud before answering!' : '🤫 Let the whole team whisper the doubles fact together!'; $('choices').innerHTML = ''; game.choices.forEach(value => { const b = document.createElement('button'); b.className = 'choice'; b.textContent = value; b.addEventListener('click', () => check(value)); $('choices').appendChild(b) }) } if (game.stage === 'finished') $('winner').textContent = solo ? `⭐ You earned ${game.score[0]} points!` : game.score[0] === game.score[1] ? '🤝 It’s a tie!' : game.score[0] > game.score[1] ? '🔵 Team Blue Wins!' : '🟢 Team Green Wins!' } function check(value) { if (game.stage !== 'question') return; const f = game.facts[game.selected], correct = value === f.n * 2; if (correct) game.score[game.mode === 'solo' ? 0 : game.turn] += f.points; game.opened.push(game.selected); $('solution').textContent = `${f.n} + ${f.n} = ${f.n * 2}`; $('feedback').textContent = correct ? `🎉 Correct! +${f.points} mystery points!` : `You chose ${value}. The correct answer is ${f.n * 2}. No points this turn.`; game.stage = 'result'; render() } function next() { game.selected = null; if (game.mode === 'teams') game.turn = 1 - game.turn; game.stage = game.opened.length === 12 ? 'finished' : 'boxes'; render() } $('next').addEventListener('click', next); $('restart').addEventListener('click', newGame); $('again').addEventListener('click', newGame); $('mode').addEventListener('change', newGame); $('difficulty').addEventListener('change', newGame); newGame() })();
    </script>
</body>

</html>
